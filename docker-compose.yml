services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./server/Db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventory} -d ${POSTGRES_DB:-inventory}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: inventory-management-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning PING | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: inventory-management-api:latest
    container_name: inventory-management-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://0.0.0.0:3001}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      POSTGRES_CONNECTION: "Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-inventory};Username=${POSTGRES_USER:-inventory};Password=${POSTGRES_PASSWORD}"
      REDIS_CONNECTION: "${REDIS_HOST:-redis}:${REDIS_PORT:-6379},password=${REDIS_PASSWORD}"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-inventory-mgmt}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-inventory-mgmt-web}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-8}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      LEGACY_INVENTORY_FILE: ${LEGACY_INVENTORY_FILE:-/data/inventory.xlsx}
    volumes:
      - ./data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: inventory-management-web:latest
    container_name: inventory-management-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
